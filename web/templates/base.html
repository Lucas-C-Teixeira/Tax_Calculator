<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        TaxEngine • {% block title %}{% endblock %}
    </title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background:
                radial-gradient(circle at top left, #dbeafe 0%, transparent 25%),
                radial-gradient(circle at bottom right, #e0f2fe 0%, transparent 25%),
                #f8fafc;
        }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.6);
        }

        .fade-up {
            animation: fadeUp .6s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

</head>

<body class="min-h-screen text-slate-900">

    {% if session.get('user') %}

    <!-- NAVBAR -->
    <header class="sticky top-0 z-50 px-4 md:px-8 pt-4">

        <div class="glass rounded-3xl px-6 py-4 shadow-xl shadow-slate-200/40">

            <div class="flex items-center justify-between">

                <!-- LOGO -->
                <a href="/home"
                   class="flex items-center gap-3">

                    <div class="w-12 h-12 rounded-2xl bg-blue-600 text-white flex items-center justify-center shadow-lg shadow-blue-200">
                        <i data-lucide="calculator" class="w-6 h-6"></i>
                    </div>

                    <div>
                        <h1 class="font-extrabold text-xl tracking-tight">
                            TaxCalculator
                        </h1>

                        <p class="text-xs text-slate-500">
                            Sistema Fiscal Inteligente
                        </p>
                    </div>

                </a>

                <!-- MENU -->
                <nav class="hidden md:flex items-center gap-3">

                    <a href="/home"
                       class="px-5 py-2 rounded-2xl hover:bg-slate-100 transition-all font-medium text-slate-700">
                        Dashboard
                    </a>

                    <a href="/irpj"
                       class="px-5 py-2 rounded-2xl hover:bg-slate-100 transition-all font-medium text-slate-700">
                        IRPJ
                    </a>

                    <a href="/irpf"
                       class="px-5 py-2 rounded-2xl hover:bg-slate-100 transition-all font-medium text-slate-700">
                        IRPF
                    </a>

                </nav>

                <!-- USER -->
                <div class="flex items-center gap-3">

                    <div class="hidden md:block text-right">

                        <p class="text-sm font-bold text-slate-800">
                            {{ session.get('user') }}
                        </p>

                        <p class="text-xs text-slate-500">
                            Conta ativa
                        </p>

                    </div>

                    <a href="/logout"
                       class="w-12 h-12 rounded-2xl bg-red-500 text-white flex items-center justify-center hover:scale-105 transition-all shadow-lg shadow-red-200">

                        <i data-lucide="log-out" class="w-5 h-5"></i>

                    </a>

                </div>

            </div>

        </div>

    </header>

    {% endif %}


    <!-- CONTENT -->
    <main class="px-4 md:px-8 py-8 fade-up">

        {% block content %}{% endblock %}

    </main>


    <script>
        lucide.createIcons();
    </script>

</body>
</html>
